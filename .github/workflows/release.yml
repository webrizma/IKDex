name: IKDex Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure update source
        shell: pwsh
        run: |
          @{ repositoryUrl = "https://github.com/${{ github.repository }}" } | ConvertTo-Json | Set-Content IKDex/update.json -Encoding UTF8
      - name: Publish application
        run: dotnet publish IKDex/IKDex.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ env.VERSION }}
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Download previous releases
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --outputDir Releases --token ${{ secrets.GITHUB_TOKEN }}
      - name: Build update packages
        run: vpk pack --packId IKDex.HR --packVersion ${{ env.VERSION }} --packDir publish --mainExe IKDex.exe --packTitle IKDex --icon IKDex/Assets/ikdex-app.ico --outputDir Releases
      - name: Publish GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --outputDir Releases --token ${{ secrets.GITHUB_TOKEN }} --publish --tag ${{ github.ref_name }} --releaseName "IKDex ${{ env.VERSION }}"
